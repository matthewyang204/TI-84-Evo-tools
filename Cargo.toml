[package]
name = "ti-evo-tools"
version = "1.0.0"
edition = "2024"
authors = ["NomadTax", "Matthew Yang (杨佳明)"]
license = "MIT"
readme = "README.md"
description = "A small native Qt Quick Controls screen-capture client for TI-84 Evo calculators"
publish = false

[dependencies]
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serialport = "4.10"

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[patch.crates-io]
qt-build-utils = { path = "vendor/qt-build-utils" }

[package.metadata.bundle]
name = "TI-84 Toolbox"
identifier = "com.matthewyang204.ti-evo-tools"  # reverse‑DNS, used as CFBundleIdentifier
icon = ["assets/main-icon.icns"]
description = "A client for TI-84 Evo calculators, written with Qt and Rust and designed to be performant on slow computers"
copyright = "© NomadTax 2026\n© Matthew Yang (杨佳明) 2026"

# FileDescription, ProductName, ProductVersion, OriginalFilename and LegalCopyright
[package.metadata.winres]
ProductName = "TI-84 Toolbox"
ProductVersion = version
FileDescription = "A client for TI-84 Evo calculators, written with Qt and Rust and designed to be performant on slow computers"
OriginalFilename = "TI-EVO-TOOLS.exe"
LegalCopyright = "© NomadTax 2026\n© Matthew Yang (杨佳明) 2026"
